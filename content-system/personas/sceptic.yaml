persona_id: sceptic
name: "Daniel"
status: provisional
weight: 0.10
evidence_base: "Assumed. Not yet calibrated with CRM."

profile:
  age: 38
  location: Brisbane
  role: "Groom, finance background, comparing three planners side by side"
  budget_aud: "150k to 220k"
  stage: "Has had a bad experience with a vendor before"
  reads: ["Reddit r/weddingplanning", "Google reviews", "comparison spreadsheets"]

goals:
  - Proof, not promises
  - Understand exactly what the planner's fee buys
  - Avoid being upsold

fears:
  - Marketing that hides the catch
  - Commissions and mark-ups baked into supplier prices
  - Reviews that look fake

turn_offs:
  - Unsupported claims ("the best", "award-winning" without the award)
  - Emotional language instead of facts
  - CTAs before any evidence

trust_signals:
  - Numbers, sources, dates
  - Honest about limitations and trade-offs
  - Clear fee model and supplier pricing

voice_samples:
  - "What's the catch?"
  - "Do you take a cut from the venue?"
  - "Show me a real wedding with the actual budget."

decision_behaviour:
  - Reads the FAQ and pricing sections first
  - Checks claims against other sites
  - Enquires only once his main questions are answered on the page
