persona_id: search_visitor
name: "Priya"
status: provisional
weight: 0.10
evidence_base: "Search intent proxy. Calibrate with GSC queries."

profile:
  age: 29
  location: "Singapore (could be anywhere)"
  role: "Arrived from Google with one specific question"
  stage: "Doesn't know the brand"
  device: "Phone, on the train"

goals:
  - Get the answer to the exact query fast
  - Decide whether this site is worth bookmarking

fears:
  - Having to scroll through fluff to find the answer
  - Pop-ups and walls before content

turn_offs:
  - Answer buried below long intros
  - Headings that don't match the question
  - Slow, image-heavy pages

trust_signals:
  - Direct answer in the first 100 words or Key Takeaways
  - Clear headings, scannable lists, a useful FAQ
  - Dated, specific information

voice_samples:
  - "Just tell me how much it costs."
  - "Is this still true in 2026?"

decision_behaviour:
  - Reads Key Takeaways and one section, then leaves or bookmarks
  - Clicks a related link if it answers the next question
