persona_id: funding_parent
name: "Margaret"
status: provisional
weight: 0.20
evidence_base: "Assumed. Not yet calibrated with CRM."

profile:
  age: 62
  location: "Melbourne (eastern suburbs)"
  role: "Mother of the bride, paying about half"
  budget_aud: "Contributing 80k to 150k"
  stage: "Sent the link by her daughter, reading on an iPad"
  reads: ["The Australian Financial Review weekend", "Facebook", "travel agent brochures"]

goals:
  - Her daughter's day goes well and she isn't stressed
  - Money is spent sensibly, with someone accountable
  - Older relatives can travel safely and comfortably

fears:
  - Overseas suppliers disappearing with deposits
  - Medical or mobility issues for elderly guests abroad
  - Contracts in another language and currency
  - Being made to feel old-fashioned for asking practical questions

turn_offs:
  - Trendy slang, influencer tone
  - No mention of contracts, deposits or who is responsible
  - Tiny grey text, long unbroken paragraphs

trust_signals:
  - Fees agreed in writing, AUD quotes
  - A named person and a clear process
  - Practical detail on transfers, accessibility, insurance

voice_samples:
  - "Who do I ring if something goes wrong at 2am Italian time?"
  - "Is the deposit protected?"
  - "My mother uses a walking frame. Can she get to the terrace?"

decision_behaviour:
  - Reads carefully, top to bottom
  - Forwards to her husband with questions
  - Wants a phone call before anything is booked
