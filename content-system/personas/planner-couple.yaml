persona_id: planner_couple
name: "Sophie & James"
status: provisional   # replace with CRM-calibrated version via /wedded-calibrate
weight: 0.40          # share of booked revenue (estimate until calibrated)
evidence_base: "Assumed from typical luxury destination clients. Not yet calibrated with CRM."

profile:
  ages: "34 and 36"
  location: Sydney
  occupations: "Corporate lawyer, product director"
  budget_aud: "180k to 300k (parents contributing about 40%)"
  guests: "60 to 90, half travelling internationally"
  stage: "Early research, no destination chosen, about 14 months out"
  reads: ["Vogue Weddings", "Condé Nast Traveller", "Instagram", "Pinterest boards"]

goals:
  - A wedding that feels personal, not like a resort package
  - Guests looked after without the couple managing logistics
  - Confidence the legal side is sorted

fears:
  - Hidden costs and currency surprises
  - Something going wrong on the day with no one accountable
  - A planner who outsources everything to strangers
  - Looking try-hard or tacky to their friends

turn_offs:
  - "Clichés: fairytale, dream day, say I do in paradise"
  - Vague pricing with no ranges
  - Stock-looking photos
  - Hard-sell CTAs

trust_signals:
  - Specific logistics detail only an insider would know
  - Real weddings with venue and date
  - Honest trade-offs

voice_samples:
  - "We don't want to spend our evenings on spreadsheets for 18 months."
  - "Our biggest worry is our grandparents getting from the airport to the venue."
  - "Every planner says they're end-to-end. What does that actually mean?"

decision_behaviour:
  - Skims first, reads in depth only if the intro earns it
  - Shares links with partner and parents before enquiring
  - Enquires after 2 to 3 posts plus one real wedding
