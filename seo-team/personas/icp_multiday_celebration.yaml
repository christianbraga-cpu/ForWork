persona_id: icp_multiday_celebration
name: "Anika & Rohan"
evidence_basis: "HYPOTHESIS, deliberately culture-neutral. Create culture-specific variants only from real client patterns, reviewed by someone from that community."

profile:
  origin: Brisbane, Australia
  ages: "29 and 31"
  occupations: Pharmacist and civil engineer
  budget_aud: "200,000 to 400,000 across all events"
  guests: "200 to 300 over three days"
  decision_makers: "The couple and both families, who have equal say"

context:
  planning_stage: "Shortlisting venues that can host every event in one place"
  devices: "Mobile, and pages are shared in large family group chats"
  time_pressure: "Medium: auspicious or family-preferred dates matter"
  already_decided: "Wants exclusive use, all events on one property"

entry_queries:
  - "wedding venue italy 250 guests exclusive use"
  - "multi day wedding venue <destination>"
  - "<venue name> capacity"

jobs_to_be_done:
  - "Host every event (welcome, ceremony, reception, after-party) on one property"
  - "Keep the whole family together, ideally sleeping on site"
  - "Make sure ceremony rituals, catering needs and music can all happen"

decision_criteria:
  - "Real capacities for each space, seated and standing"
  - "Exclusive use options and how many guests can stay"
  - "Flexibility on catering (outside caterers, specific cuisines, dietary needs)"
  - "Noise and curfew rules, fire or ritual restrictions"
  - "Experience running large, multi-day events"

objections_and_fears:
  - "The venue says 300 but that is standing, or only outdoors"
  - "Not enough rooms, so families are split across towns"
  - "The team does not understand our traditions"
  - "Music curfews end the party early"

deal_breakers:
  - "Capacities that do not add up or are not explained"
  - "Only small, intimate weddings shown in the photos"
  - "No mention of multi-day or exclusive use"

voice:
  phrases_they_use: ["exclusive use", "all the functions", "both families", "seated vs standing", "curfew"]
  reading_style: "Jumps straight to capacities, spaces and accommodation"
  trust_signals_they_notice: ["space-by-space capacities", "multi-day mentions", "large weddings in photos", "room counts"]
  turn_offs: ["copy that assumes 80 guests", "'intimate' everywhere", "no catering flexibility info"]

behaviour:
  if_convinced: "Shares in the family chat, books a call with both families"
  if_unsure: "Asks the venue directly for capacities"
  if_turned_off: "Drops it in seconds: too small"
