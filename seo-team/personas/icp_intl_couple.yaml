persona_id: icp_intl_couple
name: "Priya & James"
evidence_basis: "HYPOTHESIS. Replace with Zoho CRM won/lost deals and consultation notes."

profile:
  origin: Sydney, Australia
  ages: "32 and 34"
  occupations: Corporate lawyer and tech founder
  budget_aud: "120,000 to 220,000 all in"
  guests: "80 to 120, about 60% flying from Australia"
  decision_makers: "The couple (primary). Priya's parents co-fund and have strong opinions."

context:
  planning_stage: "Early research, 14 to 20 months out"
  devices: "Mobile at lunch, desktop together on weekends"
  time_pressure: "Low on date, very high on time: both work long hours"
  already_decided: "Europe, probably Italy or Greece"

entry_queries:
  - "<destination> wedding venue for 100 guests"
  - "<venue name> wedding cost"
  - "destination wedding planner italy australia"

jobs_to_be_done:
  - "Feel sure one team handles everything, so we are not project-managing from 16,000 km away"
  - "Guests, including elderly grandparents, have an easy and memorable trip"
  - "A wedding that feels like ours, not the venue's standard package"

decision_criteria:
  - "What it will really cost, at least as a range, for our guest count"
  - "Where each part of the day happens, and the plan if it rains"
  - "Whether most guests can stay on site"
  - "Who we will actually deal with, and in what time zone"
  - "Proof that this team has done weddings like ours"

objections_and_fears:
  - "We will be handed to a junior coordinator once we sign"
  - "Hidden costs: vendor markups, planner travel, currency swings"
  - "Italian marriage paperwork for Australians sounds like a nightmare"
  - "The photos are the venue's best angle, not what our day will look like"
  - "Mum and Dad will think it is poor value"

deal_breakers:
  - "No price guidance at all"
  - "Stock photos or obviously staged images"
  - "Gushing, generic copy ('your fairytale awaits')"
  - "Slow or broken on mobile"
  - "Forms that ask for everything before telling us anything"

voice:
  phrases_they_use: ["all in", "for our numbers", "logistics", "our guests", "what's actually included"]
  reading_style: "Skims headings first. Reads deeply only if the headings earn it."
  trust_signals_they_notice: ["named spaces and capacities", "from prices in AUD", "a named planner", "clear inclusions", "distances and travel times"]
  turn_offs: ["superlatives without proof", "exclamation marks", "'luxury' used repeatedly", "pressure to book"]

behaviour:
  if_convinced: "Send the page to each other and Priya's mum, enquire within a week"
  if_unsure: "Save it, open three competitor tabs, compare from prices"
  if_turned_off: "Back to Google, never returns"
