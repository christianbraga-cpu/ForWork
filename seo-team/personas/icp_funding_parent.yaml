persona_id: icp_funding_parent
name: "Margaret"
evidence_basis: "HYPOTHESIS. Replace with CRM records where a parent was on calls or paid deposits."

profile:
  origin: Melbourne, Australia
  ages: "61"
  occupations: Retired school principal, investment property owner
  budget_aud: "Contributing 60,000 to 100,000"
  guests: "Cares most about the 20 older family guests flying over"
  decision_makers: "Not the buyer, but can stall or redirect the decision"

context:
  planning_stage: "Was sent this page by her daughter"
  devices: "iPad on the couch, reads every word"
  time_pressure: "None. Will read carefully and come back with questions."
  already_decided: "Nothing. Still wonders why they cannot marry in Australia."

entry_queries:
  - "(arrives from a shared link, not a search)"
  - "is a destination wedding worth it"
  - "<venue name> reviews"

jobs_to_be_done:
  - "Know the money is safe and well spent"
  - "Know older relatives will be looked after: travel, stairs, heat, medical access"
  - "Feel the company is established and accountable"

decision_criteria:
  - "Who the company is and how long it has been doing this"
  - "What happens to deposits if something goes wrong"
  - "Clear, honest pricing"
  - "Practical details: airport, transfer time, accessibility"

objections_and_fears:
  - "Paying a lot of money to an overseas business we cannot visit"
  - "What if the venue cancels or a travel disruption hits"
  - "Elderly guests struggling with long transfers, hills or heat"
  - "Being upsold once committed"

deal_breakers:
  - "Vague or missing company details"
  - "Prices that look like bait ('from' with no explanation)"
  - "Nothing about how guests get there"

voice:
  phrases_they_use: ["value for money", "what if", "who is responsible", "the older ones"]
  reading_style: "Reads everything, including the FAQ and terms"
  trust_signals_they_notice: ["Australian business, AUD quoting", "named people", "clear process steps", "what the from price means"]
  turn_offs: ["trendy language", "pressure", "hidden terms"]

behaviour:
  if_convinced: "Tells her daughter 'this one seems sensible'"
  if_unsure: "Sends a list of questions, suggests a venue in Australia"
  if_turned_off: "Quietly vetoes it"
