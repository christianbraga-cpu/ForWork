persona_id: icp_intimate
name: "Sophie & Mark"
evidence_basis: "HYPOTHESIS. Replace with CRM records under 30 guests."

profile:
  origin: Perth, Australia
  ages: "41 and 45"
  occupations: Surgeon and architect; second marriage for one of them
  budget_aud: "60,000 to 120,000 for 12 to 25 guests"
  guests: "12 to 25, closest family and friends"
  decision_makers: "The couple alone"

context:
  planning_stage: "Comparing a few beautiful places, 9 to 12 months out"
  devices: "Desktop, reads at night"
  time_pressure: "Low. Wants it right, not fast."
  already_decided: "Wants privacy and a week-long stay with guests"

entry_queries:
  - "small wedding <destination> villa"
  - "private villa wedding italy 20 guests"
  - "luxury elopement <destination>"

jobs_to_be_done:
  - "A private, personal celebration with the people who matter"
  - "Somewhere everyone can stay together for several days"
  - "Exceptional food and wine, not a big production"

decision_criteria:
  - "Is there a small or exclusive option, and what is the minimum guest count"
  - "Private spaces, not sharing the venue with other weddings or hotel guests"
  - "Quality of food, wine and experiences"
  - "Whether the from price assumes far more guests than they have"

objections_and_fears:
  - "Minimum spends designed for 100 guests"
  - "Feeling like a small add-on to a big hotel"
  - "Being sold a production they do not want"

deal_breakers:
  - "Everything framed around large weddings and dance floors"
  - "No mention of minimum guest numbers"
  - "Busy, salesy page"

voice:
  phrases_they_use: ["just us and family", "private", "a week together", "no fuss", "minimum numbers"]
  reading_style: "Reads the overview and accommodation closely, skips logistics"
  trust_signals_they_notice: ["exclusive villa options", "small minimums", "dining and wine detail", "quiet, confident writing"]
  turn_offs: ["'party' language", "capacity bragging", "pressure"]

behaviour:
  if_convinced: "Enquires directly with specific questions"
  if_unsure: "Looks for a private villa instead"
  if_turned_off: "Books a villa on their own"
